name: cajun-extensions

# This monorepo holds several packages, so this workflow only runs when
# cajun-extensions or something it builds against changes. GitHub does not
# evaluate path filters on tag pushes, so a cajun-extensions-v* tag always
# triggers a release.
on:
  push:
    branches: [main]
    tags: ["cajun-extensions-v*"]
    paths:
      - "extensions/cajun-extensions/**"
      - "extensions/reaziglib/**"
      - ".github/workflows/cajun-extensions.yml"
  pull_request:
    paths:
      - "extensions/cajun-extensions/**"
      - "extensions/reaziglib/**"
      - ".github/workflows/cajun-extensions.yml"
  workflow_dispatch:

# macOS jobs are pinned to macos-15: on the macos-26 image that
# macos-latest now points to, Zig 0.14.1 links nothing from the C library
# (likely the newer SDK's library stubs), while the macOS 15 SDK works.
jobs:
  # The extension contains C++ that REAPER calls (the control surface shim),
  # which must be compiled with REAPER's own toolchain on each OS (see
  # extensions/README.md). Because of that, every platform builds natively.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    name: linux-x86_64,   target: native,       ext: so }
          - { os: ubuntu-24.04-arm, name: linux-aarch64,  target: native,       ext: so }
          # Apple clang builds both macOS architectures from one runner.
          - { os: macos-15,     name: macos-aarch64,  target: native,       ext: dylib }
          - { os: macos-15,     name: macos-x86_64,   target: x86_64-macos, ext: dylib }
          - { os: windows-latest,   name: windows-x86_64, target: native,       ext: dll }

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    defaults:
      run:
        shell: bash
        working-directory: extensions/cajun-extensions

    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      # cl is only on PATH inside a Visual Studio developer environment.
      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Extract version from tag
        id: version
        shell: bash
        # Tags look like cajun-extensions-v1.2.3; other runs build a "dev" version.
        run: |
          if [[ "$GITHUB_REF" == refs/tags/cajun-extensions-v* ]]; then
            echo "version=${GITHUB_REF_NAME#cajun-extensions-v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        if: matrix.target == 'native'
        run: zig build test

      - name: Build
        run: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe -Dversion=${{ steps.version.outputs.version }}

      - name: Package
        run: |
          set -euo pipefail
          pkg="dist/cajun-extensions-${{ matrix.name }}"
          mkdir -p "$pkg"
          cp "zig-out/reaper_cajun_extensions.${{ matrix.ext }}" "$pkg/"
          cp README.md "$pkg/README.md"
          # cmake is on every runner image, unlike zip/7z.
          (cd dist && cmake -E tar cf "cajun-extensions-${{ matrix.name }}.zip" --format=zip "cajun-extensions-${{ matrix.name }}")

      - uses: actions/upload-artifact@v4
        with:
          name: cajun-extensions-${{ matrix.name }}
          path: extensions/cajun-extensions/dist/*.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/cajun-extensions-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create the release and upload assets
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
          # Several extensions release from this repository, so no single
          # release may claim "Latest".
          make_latest: false
