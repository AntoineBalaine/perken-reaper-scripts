name: cajun-extensions

# This monorepo holds several packages, so this workflow only runs when
# cajun-extensions or something it builds against changes. GitHub does not
# evaluate path filters on tag pushes, so a cajun-extensions-v* tag always
# triggers a release.
on:
  push:
    branches: [main]
    tags: ["cajun-extensions-v*"]
    paths:
      - "extensions/cajun-extensions/**"
      - "extensions/reaziglib/**"
      - ".github/workflows/cajun-extensions.yml"
  pull_request:
    paths:
      - "extensions/cajun-extensions/**"
      - "extensions/reaziglib/**"
      - ".github/workflows/cajun-extensions.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create the release and upload assets
    defaults:
      run:
        working-directory: extensions/cajun-extensions
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Test
        run: zig build test

      # The extension is pure Zig, so every platform cross-compiles from one runner.
      - name: Build all REAPER platforms
        run: |
          set -euo pipefail
          targets=(
            "linux-x86_64    x86_64-linux-gnu  so"
            "linux-aarch64   aarch64-linux-gnu so"
            "macos-x86_64    x86_64-macos      dylib"
            "macos-aarch64   aarch64-macos     dylib"
            "windows-x86_64  x86_64-windows    dll"
            "windows-aarch64 aarch64-windows   dll"
          )
          mkdir -p dist
          for row in "${targets[@]}"; do
            read -r name tgt ext <<<"$row"
            echo "::group::$name ($tgt)"
            rm -rf zig-out
            zig build -Dtarget="$tgt" -Doptimize=ReleaseSafe
            pkg="dist/cajun-extensions-$name"
            mkdir -p "$pkg"
            cp "zig-out/reaper_cajun_extensions.$ext" "$pkg/"
            cp README.md "$pkg/README.md"
            (cd dist && zip -qr "cajun-extensions-$name.zip" "cajun-extensions-$name")
            echo "::endgroup::"
          done
          ls -la dist/*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: cajun-extensions-builds
          path: extensions/cajun-extensions/dist/*.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/cajun-extensions-v')
        uses: softprops/action-gh-release@v2
        with:
          files: extensions/cajun-extensions/dist/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
