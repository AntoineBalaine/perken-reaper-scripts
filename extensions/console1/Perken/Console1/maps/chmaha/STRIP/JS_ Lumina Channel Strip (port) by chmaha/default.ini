version = 1
module=STRIP
fx_name=JS: Lumina Channel Strip (port) by chmaha
fx_preset=default
Inpt_Gain=0 ; Input Gain (dB)
Inpt_LoCut=35 ; HPF Freq (Hz)
Inpt_HiCut=37 ; LPF Freq (Hz)
Shp_Gate=40 ; Gate Threshold (dB)
Shp_Punch=41 ; Gate Attack (ms)
Shp_GateRelease=42 ; Gate Release (ms)
Shp_hard_gate=44 ; Gate Mode (Gate/Duck)
Shp_shape=39 ; Gate On
Eq_eq=2 ; EQ On
Eq_LoFrq=3 ; EQ 10 Hz (dB)
Eq_HiMidFrq=9 ; EQ Air Type
Eq_HiFrq=8 ; EQ Air Gain (dB)
Eq_hp_shape=10 ; EQ Analog
Eq_lp_shape=11 ; EQ Keep Gain
Eq_LoGain=4 ; EQ 40 Hz (dB)
Eq_LoMidGain=5 ; EQ 160 Hz (dB)
Eq_HiMidGain=6 ; EQ 640 Hz (dB)
Eq_HiGain=7 ; EQ 2.5 kHz (dB)
Comp_comp=12 ; Comp On
Comp_Thresh=13 ; Comp Threshold (dB)
Comp_Ratio=14 ; Comp Ratio
Comp_Attack=15 ; Comp Attack (ms)
Comp_Release=16 ; Comp Release (ms)
Comp_DryWet=19 ; Comp Parallel (%)
Out_Drive=22 ; Sat Drive (%)
Out_DriveChar=21 ; Sat Console (Burnley/Maryland/Oxford/Tokyo/Washington)
Out_Vol=29 ; Output Gain (dB)
Comp_GR=47 ; Comp GR (dB), where the compressor keeps its gain reduction, for the meter

; The fullest strip in the set: it has input gain, a five band EQ with air,
; compressor, saturation, limiter, output gain, filters and a gate, so almost
; every Console 1 control lands somewhere.
;
; Its EQ is fixed frequency, 10/40/160/640/2500 Hz, so the Console 1 frequency
; encoders have no frequency to drive. They carry the controls that have no
; place of their own instead: the lowest one drives the 10 Hz band, the high mid
; one the Air Type and the high one the Air Gain. The two shape buttons are the
; Analog switch (Hi Shape) and the Keep Gain switch (Lo Shape).
;
; PENDING: the compressor filter knobs that "filters to compressor" shows. The
; wanted entries are
;   Comp_LoCut=18 ; Comp SC HPF
;   Comp_HiCut=17 ; Comp Hold
; but the format of a channel strip map has no Comp_LoCut or Comp_HiCut yet, and
; the panel disables those knobs on a strip, so they are not written as entries.
;
; Eq_eq, Comp_comp and Shp_shape stay on Lumina's own EQ On (2), Comp On (12) and
; Gate On (39) rather than on REAPER's Bypass, which for this plugin sits at 48
; with Wet at 49 and Delta at 50. On a channel strip each section button should
; toggle its own section, and REAPER's Bypass would silence the whole strip.
; Comp_DryWet is likewise on the compressor's own Parallel (19), not REAPER's
; Wet, which would be a whole-strip mix.
;
; KNOWN ISSUE: these three are "On" switches, where the Console 1 bypass buttons
; expect a "Bypass" parameter, so the three lights and presses come out inverted.
; The map format has no way to invert a parameter yet.
;
; The preset "default" that is embedded below starts the strip with the input
; filters on (Filter On, 34) and the limiter off (Lim On, 25), and every other
; parameter at the default of the plugin. Console 1 applies it when the plugin is
; inserted from the browser. Out_Pan is unmapped because Lumina has no pan.
; Shp_sustain is unmapped: the gate has a Range (43) but no transient shaping.
; The rest of the limiter (26-28, 33) and the preset selector (31) are left
; free, as is Phase Invert (1), which Console 1 handles as a track parameter.

; 0 Input Gain (dB)
; 1 Phase Invert
; 2 EQ On
; 3 EQ 10 Hz (dB)
; 4 EQ 40 Hz (dB)
; 5 EQ 160 Hz (dB)
; 6 EQ 640 Hz (dB)
; 7 EQ 2.5 kHz (dB)
; 8 EQ Air Gain (dB)
; 9 EQ Air Type
; 10 EQ Analog
; 11 EQ Keep Gain
; 12 Comp On
; 13 Comp Threshold (dB)
; 14 Comp Ratio
; 15 Comp Attack (ms)
; 16 Comp Release (ms)
; 17 Comp Hold
; 18 Comp SC HPF
; 19 Comp Parallel (%)
; 20 Sat On
; 21 Sat Console
; 22 Sat Drive (%)
; 23 Sat Output (%)
; 24 Sat Mix (%)
; 25 Lim On
; 26 Lim Threshold (dB)
; 27 Lim Release (ms)
; 28 Lim True Peak
; 29 Output Gain (dB)
; 30 Bypass
; 31 Preset
; 32 Comp Auto Gain
; 33 Lim Gain (dB)
; 34 Filter On
; 35 HPF Freq (Hz)
; 36 HPF Resonance
; 37 LPF Freq (Hz)
; 38 LPF Resonance
; 39 Gate On
; 40 Gate Threshold (dB)
; 41 Gate Attack (ms)
; 42 Gate Release (ms)
; 43 Gate Range (dB)
; 44 Gate Mode
; 45 Output TP Meter
; 46 Gate Position
; 47 Comp GR (dB), read only, from version 1.1 of the plugin (Comp_GR)
; 48 Bypass (REAPER)
; 49 Wet (REAPER)
; 50 Delta (REAPER)

; Source: https://github.com/chmaha/DSP-Ports-JSFX

