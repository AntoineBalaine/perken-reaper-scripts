; The fullest strip in the set: it has input gain, a five band EQ with air,
; compressor, saturation, limiter, output gain, filters and a gate, so almost
; every Console 1 control lands somewhere.
;
; Its EQ is fixed frequency, 10/40/160/640/2500 Hz, so the four Console 1
; frequency encoders have nothing to drive and stay unmapped; only the gains are
; mapped. The two bands left over, 10 Hz and Air, are put on the reassignable
; controls so they are still reachable.
;
; Out_Pan is unmapped because Lumina has no pan. Shp_sustain is unmapped: the
; gate has a Range (43) but no transient shaping. The limiter (25-28, 33) and
; the preset selector (31) are left free, as is Phase Invert (1), which Console 1
; handles as a track parameter rather than an FX one.

