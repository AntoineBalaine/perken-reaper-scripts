; fil4 covers the whole Console 1 EQ section with nothing missing, which no
; other plugin in this set manages. The two shape buttons are on the shelf
; enables rather than on the filter resonances: on the hardware they switch the
; LF and HF bands between shelf and bell, and enabling or bypassing the shelf is
; the closer equivalent.
;
; Bands 3 and 4 (20-27) and the global Gain (1) are unused, as are the highpass
; and lowpass (2-7), which belong to the INPUT section. A second mapping using
; bands 3 and 4 instead would suit material needing two upper-mid bands.

