version = 1
module=COMP
fx_name=JS: Compressor (x42-darc port) by chmaha
Comp_Attack=3 ; Attack (ms)
Comp_DryWet=8 ; Wet (REAPER)
Comp_Ratio=2 ; Ratio (1=Off, N=1:N, ~200=Lim)
Comp_Release=4 ; Release (ms)
Comp_Thresh=1 ; Threshold (dB)
Comp_comp=7 ; Bypass (REAPER)
Comp_HiCut=
Comp_LoCut=

; darc has no mix control and no bypass slider of its own, so Comp_DryWet and
; Comp_comp use REAPER's, which every FX has: after a plugin's own parameters
; REAPER appends Bypass, Wet and Delta, so here 7, 8 and 9.
;
; Input Gain (0) is deliberately left alone: it belongs to the INPUT section
; rather than the compressor. Hold (5) and Graph Mode (6) have no Console 1
; equivalent.

; 0 Input Gain (dB)
; 1 Threshold (dB)
; 2 Ratio (1=Off, N=1:N, ~200=Lim)
; 3 Attack (ms)
; 4 Release (ms)
; 5 Hold
; 6 Graph Mode
; 7 Bypass (REAPER)
; 8 Wet (REAPER)
; 9 Delta (REAPER)

; Source: https://github.com/chmaha/DSP-Ports-JSFX
