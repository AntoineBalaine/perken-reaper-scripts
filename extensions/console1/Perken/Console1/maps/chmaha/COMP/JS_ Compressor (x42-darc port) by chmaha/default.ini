version = 1
module=COMP
fx_name=JS: Compressor (x42-darc port) by chmaha
Comp_Attack=3 ; Attack (ms)
Comp_DryWet=
Comp_Ratio=2 ; Ratio (1=Off, N=1:N, ~200=Lim)
Comp_Release=4 ; Release (ms)
Comp_Thresh=1 ; Threshold (dB)
Comp_comp=
Comp_HiCut=
Comp_LoCut=

; darc has no mix control and no bypass slider, so Comp_DryWet and Comp_comp
; stay unmapped. Input Gain (0) is deliberately left alone: it belongs to the
; INPUT section rather than the compressor. Hold (5) and Graph Mode (6) have no
; Console 1 equivalent.

; 0 Input Gain (dB)
; 1 Threshold (dB)
; 2 Ratio (1=Off, N=1:N, ~200=Lim)
; 3 Attack (ms)
; 4 Release (ms)
; 5 Hold
; 6 Graph Mode

; Source: https://github.com/chmaha/DSP-Ports-JSFX
