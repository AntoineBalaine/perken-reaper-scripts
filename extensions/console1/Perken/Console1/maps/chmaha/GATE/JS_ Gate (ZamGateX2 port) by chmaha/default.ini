version = 1
module=GATE
fx_name=JS: Gate (ZamGateX2 port) by chmaha
Shp_Gate=0 ; Threshold (dB)
Shp_GateRelease=2 ; Release (ms)
Shp_Punch=1 ; Attack (ms)
Shp_hard_gate=6 ; Mode (Gate/Duck)
Shp_shape=
Shp_sustain=3 ; Max Gate Close (dB)

; Two judgement calls worth reviewing. Shp_sustain is on Max Gate Close, the
; gate's depth, as the nearest continuous analogue to how much signal is held
; down. Shp_hard_gate is on the Gate/Duck mode switch because it is a button on
; the hardware. Shp_shape has no counterpart: ZamGate does no transient
; shaping. Makeup (4) and Sidechain (5) are left for the INPUT section and the
; dedicated sidechain control.

; 0 Threshold (dB)
; 1 Attack (ms)
; 2 Release (ms)
; 3 Max Gate Close (dB)
; 4 Makeup (dB)
; 5 Sidechain
; 6 Mode

; Source: https://github.com/chmaha/DSP-Ports-JSFX
